services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-kaggle_06_predicting_f1_pit__stops_dev}
    volumes:
      - ./:/workspace:cached
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8501:8501"
      - "127.0.0.1:8888:8888"
    tty: true

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000
